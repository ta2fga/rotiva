name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK paketleri
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Sürüm bilgisi
        run: |
          echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: Birim testleri ve debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: APK adını hazırla
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Rotiva-debug.apk
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            cp app/build/outputs/apk/debug/app-debug.apk "dist/Rotiva-${GITHUB_REF_NAME}.apk"
          fi

      - name: APK'yı artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: Rotiva-debug
          path: android/dist/Rotiva-debug.apk
          if-no-files-found: error

      - name: Test raporu
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-raporu
          path: android/app/build/reports/tests/

      - name: GitHub Release oluştur
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > notes.md <<EOF
          ## Rotiva - Android ${GITHUB_REF_NAME}

          Masaüstü uygulamanın Android sürümü (Kotlin + Jetpack Compose).

          ### Özellikler
          - ELM327 BLE OBD bağlantısı (FFF0/FFF1/FFF2), Demo ve Telefon (yalnızca GPS) modu
          - Panom, Tüm Değerler, Arıza Kodları, Sürüş, Geçmiş ve Ayarlar sayfaları
          - GPS + barometre ile yükseklik, toplam çıkış/iniş ve yol eğimi
          - Ekran kapalıyken de süren ön plan servisi ile sürüş kaydı
          - Eğim bağlamlı puanlama, Türkçe koçluk ipuçları ve HTML rapor paylaşımı

          ### Kurulum
          1. Aşağıdaki APK dosyasını telefona indirin.
          2. "Bilinmeyen kaynaklardan yüklemeye izin ver" ayarını açıp APK'yı yükleyin.
          3. İlk açılışta konum, Bluetooth ve bildirim izinlerini verin.

          Not: Bu APK debug anahtarıyla imzalıdır; Play Store sürümü değildir.
          EOF
          gh release create "${GITHUB_REF_NAME}" "dist/Rotiva-${GITHUB_REF_NAME}.apk" \
            --title "Rotiva Android ${GITHUB_REF_NAME}" --notes-file notes.md --verify-tag
